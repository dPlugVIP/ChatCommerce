<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — DplugVIP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0f;
      --fg: #e5e9ee;
      --muted: #8793a1;
      --primary: #00e7f2;
      --card-bg: #0c1219;
      --border: #263443;
    }

    body {
      font-family: ui-monospace, "Geist Mono", "SF Mono", Menlo, monospace;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: center;
      background-blend-mode: overlay;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon::before,
    .icon::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--primary);
      border-style: solid;
    }

    .icon::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .icon::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .icon svg {
      width: 32px;
      height: 32px;
      color: var(--primary);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .brand {
      color: var(--primary);
    }

    p {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    button {
      background: var(--primary);
      color: #001416;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 0.813rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </div>
    <h1>Uplink Lost</h1>
    <p>Connection to the <span class="brand">DplugVIP</span> network has dropped. Reconnect to resume secure access.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
