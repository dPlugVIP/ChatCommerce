services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatcommerce
      POSTGRES_PASSWORD: chatcommerce
      POSTGRES_DB: chatcommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatcommerce -d chatcommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chatcommerce:chatcommerce@db:5432/chatcommerce
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.cli seed-admin &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  redisdata:
